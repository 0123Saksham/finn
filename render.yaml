# One-click deploy: https://render.com/deploy?repo=https://github.com/0123Saksham/finn
services:
  - type: web
    name: finn
    runtime: docker
    plan: free
    region: singapore          # closest Render region to NSE/BSE and Indian users
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # Render asks for it during setup; never stored in the repo
      - key: PORT
        value: "7860"
